{% set name = "coreutils" %}
{% set version = "9.8" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://ftpmirror.gnu.org/gnu/{{ name }}/{{ name  }}-{{ version }}.tar.xz
  sha256: e6d4fd2d852c9141a1c2a18a13d146a0cd7e45195f72293a4e4c044ec6ccca15

build:
  number: 0
  skip: True  # [win]

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
    - make
    - libtool
  host:
    - libiconv {{ libiconv }}  # [osx]

# Tests running implicitly by 
# recipe/run_test.sh

about:
  home: https://www.gnu.org/software/coreutils
  license: GPL-3.0-or-later
  license_family: GPL
  license_file: COPYING
  summary: Basic utilities of the GNU operating system
  description: |
    The GNU Core Utilities are the basic file, shell and text manipulation
    utilities of the GNU operating system
  doc_url: https://www.gnu.org/software/coreutils/manual/html_node/index.html
  dev_url: https://git.savannah.gnu.org/cgit/coreutils.git

extra:
  recipe-maintainers:
    - sodre
    - mbargull
